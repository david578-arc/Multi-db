# Queries for database access
# Use keys from your Java code to keep SQL separate from code.

firstDB.createTable=CREATE TABLE IF NOT EXISTS employees (id INTEGER PRIMARY KEY, name TEXT, department TEXT, salary REAL)
firstDB.insertEmployee=INSERT INTO employees (name, department, salary) VALUES (?, ?, ?)
firstDB.selectAllEmployees=SELECT id, name, department, salary FROM employees

secondDB.createTable=CREATE TABLE IF NOT EXISTS employees (id SERIAL PRIMARY KEY, name VARCHAR(100), department VARCHAR(100), salary NUMERIC(10,2))
secondDB.insertEmployee=INSERT INTO employees (name, department, salary) VALUES (?, ?, ?)
secondDB.selectAllEmployees=SELECT id, name, department, salary FROM employees

thirdDB.createTable=CREATE TABLE IF NOT EXISTS employees (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100), department VARCHAR(100), salary DECIMAL(10,2))
thirdDB.insertEmployee=INSERT INTO employees (name, department, salary) VALUES (?, ?, ?)
thirdDB.selectAllEmployees=SELECT id, name, department, salary FROM employees

fourthDB.createTable=CREATE TABLE IF NOT EXISTS employees (id SERIAL PRIMARY KEY, name VARCHAR(100), department VARCHAR(100), salary DECIMAL(10,2))
fourthDB.insertEmployee=INSERT INTO employees (name, department, salary) VALUES (?, ?, ?)
fourthDB.selectAllEmployees=SELECT id, name, department, salary FROM employees
